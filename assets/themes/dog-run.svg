    </radialGradient>
  </defs>
  <ellipse cx="105" cy="118" rx="42" ry="22" transform="rotate(-8 105 118)" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.8"/>
  <!-- 奔跑的腿 -->
  <line x1="78" y1="132" x2="56" y2="162" stroke="#C4A882" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="88" y1="135" x2="80" y2="168" stroke="#C4A882" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="132" y2="158" stroke="#C4A882" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="130" y1="125" x2="148" y2="150" stroke="#C4A882" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="55" cy="164" rx="7" ry="3.5" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <ellipse cx="80" cy="170" rx="7" ry="3.5" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <ellipse cx="133" cy="160" rx="7" ry="3.5" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <ellipse cx="149" cy="152" rx="7" ry="3.5" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <!-- 尾巴 -->
  <path d="M140 105 Q162 95 158 75 Q156 68 152 72" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 头部 -->
  <circle cx="85" cy="80" r="30" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.8"/>
  <ellipse cx="60" cy="60" rx="9" ry="18" transform="rotate(-18 60 60)" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <ellipse cx="110" cy="58" rx="9" ry="18" transform="rotate(18 110 58)" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <!-- 眼睛（星星眼） -->
  <circle cx="78" cy="76" r="3.5" fill="#5C4033"/>
  <circle cx="96" cy="75" r="3.5" fill="#5C4033"/>
  <circle cx="79.2" cy="74.5" r="1.2" fill="white"/>
  <circle cx="97.2" cy="73.5" r="1.2" fill="white"/>
  <ellipse cx="87" cy="88" rx="4" ry="3" fill="#5C4033"/>
  <path d="M81 93 Q87 99 93 93" fill="none" stroke="#C4A882" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="84" cy="98" rx="2" ry="4" fill="#F08080" opacity="0.6" transform="rotate(5 84 98)"/>
  <circle cx="68" cy="86" r="7" fill="url(#br5)"/>
  <circle cx="108" cy="84" r="7" fill="url(#br5)"/>
  <!-- 速度线 -->
  <line x1="18" y1="70" x2="40" y2="70" stroke="#C4A882" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="22" y1="82" x2="38" y2="82" stroke="#C4A882" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  <line x1="26" y1="94" x2="42" y2="94" stroke="#C4A882" stroke-width="1.2" stroke-linecap="round" opacity="0.2"/>
</svg>
