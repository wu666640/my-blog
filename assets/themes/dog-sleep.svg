<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 线条小狗 — 趴着睡觉 -->
  <defs>
    <radialGradient id="bs6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3B3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB3B3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="145" rx="42" ry="22" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.8"/>
  <!-- 前腿（前伸趴着） -->
  <path d="M68 140 Q50 138 45 148" fill="#FFFEF9" stroke="#C4A882" stroke-width="2" stroke-linecap="round"/>
  <path d="M72 148 Q55 148 48 158" fill="#FFFEF9" stroke="#C4A882" stroke-width="2" stroke-linecap="round"/>
  <!-- 后腿 -->
  <path d="M128 140 Q140 148 142 158" fill="#FFFEF9" stroke="#C4A882" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="46" cy="150" rx="6" ry="3" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <ellipse cx="49" cy="160" rx="6" ry="3" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <ellipse cx="143" cy="160" rx="6" ry="3" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <!-- 尾巴 -->
  <path d="M138 132 Q158 135 155 148" fill="none" stroke="#C4A882" stroke-width="2" stroke-linecap="round"/>
  <!-- 头部（趴在地上） -->
  <ellipse cx="85" cy="125" rx="28" ry="22" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.8"/>
  <!-- 耳朵摊开 -->
  <ellipse cx="62" cy="118" rx="8" ry="14" transform="rotate(-40 62 118)" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <ellipse cx="105" cy="112" rx="8" ry="14" transform="rotate(30 105 112)" fill="#FFFEF9" stroke="#C4A882" stroke-width="1.5"/>
  <!-- 眼睛（闭眼ZZZ） -->
  <path d="M74 120 Q78 118 82 120" fill="none" stroke="#5C4033" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 118 Q92 116 96 118" fill="none" stroke="#5C4033" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="86" cy="128" rx="3.5" ry="2.5" fill="#5C4033"/>
  <path d="M81 133 Q86 137 91 133" fill="none" stroke="#C4A882" stroke-width="1" stroke-linecap="round"/>
  <circle cx="68" cy="128" r="6" fill="url(#bs6)"/>
  <!-- ZZZ -->
  <text x="112" y="108" font-size="14" fill="#C4A882" font-family="sans-serif" opacity="0.5">Z</text>
  <text x="122" y="96" font-size="18" fill="#C4A882" font-family="sans-serif" opacity="0.4">Z</text>
  <text x="134" y="82" font-size="22" fill="#C4A882" font-family="sans-serif" opacity="0.3">Z</text>
</svg>
