<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 八条 — 坐姿条纹猫 -->
  <defs>
    <radialGradient id="cb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3B3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB3B3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 身体 -->
  <ellipse cx="100" cy="135" rx="30" ry="28" fill="#FFFCF8" stroke="#A09080" stroke-width="1.8"/>
  <!-- 身体条纹（八条标志性条纹） -->
  <path d="M76 125 Q82 122 88 125" fill="none" stroke="#B0A090" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M76 133 Q82 130 88 133" fill="none" stroke="#B0A090" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M112 125 Q118 122 124 125" fill="none" stroke="#B0A090" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M112 133 Q118 130 124 133" fill="none" stroke="#B0A090" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 前腿 -->
  <line x1="80" y1="152" x2="78" y2="176" stroke="#A09080" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="120" y1="152" x2="122" y2="176" stroke="#A09080" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="78" cy="178" rx="8" ry="4.5" fill="#FFFCF8" stroke="#A09080" stroke-width="1.5"/>
  <ellipse cx="122" cy="178" rx="8" ry="4.5" fill="#FFFCF8" stroke="#A09080" stroke-width="1.5"/>
  <!-- 尾巴（缠绕状） -->
  <path d="M126 142 Q148 148 150 132 Q151 118 138 120 Q130 122 128 130" fill="none" stroke="#A09080" stroke-width="2" stroke-linecap="round"/>
  <path d="M147 142 Q143 134 148 126" fill="none" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 头部 -->
  <circle cx="100" cy="88" r="32" fill="#FFFCF8" stroke="#A09080" stroke-width="1.8"/>
  <!-- 尖耳朵 -->
  <polygon points="72,65 64,32 90,58" fill="#FFFCF8" stroke="#A09080" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="128,65 136,32 110,58" fill="#FFFCF8" stroke="#A09080" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 内耳粉色 -->
  <polygon points="74,60 67,40 86,57" fill="#FFD0C8" stroke="none"/>
  <polygon points="126,60 133,40 114,57" fill="#FFD0C8" stroke="none"/>
  <!-- 眼睛（绿色竖瞳 — 八条猫特征） -->
  <ellipse cx="88" cy="84" rx="5" ry="6" fill="#A09080"/>
  <ellipse cx="112" cy="84" rx="5" ry="6" fill="#A09080"/>
  <ellipse cx="88" cy="84" rx="1.8" ry="5.5" fill="#C8E8C0"/>
  <ellipse cx="112" cy="84" rx="1.8" ry="5.5" fill="#C8E8C0"/>
  <circle cx="89" cy="82" r="1.2" fill="white"/>
  <circle cx="113" cy="82" r="1.2" fill="white"/>
  <!-- 鼻子 -->
  <polygon points="97,94 100,91 103,94" fill="#E0A090"/>
  <!-- 嘴巴 -->
  <path d="M93 97 Q97 100 100 97 Q103 100 107 97" fill="none" stroke="#A09080" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 胡须 -->
  <g stroke="#B0A090" stroke-width="1.2" stroke-linecap="round">
    <line x1="58" y1="88" x2="78" y2="92"/>
    <line x1="56" y1="94" x2="77" y2="95"/>
    <line x1="58" y1="100" x2="78" y2="98"/>
    <line x1="142" y1="88" x2="122" y2="92"/>
    <line x1="144" y1="94" x2="123" y2="95"/>
    <line x1="142" y1="100" x2="122" y2="98"/>
  </g>
  <!-- 红晕 -->
  <circle cx="74" cy="94" r="7" fill="url(#cb1)"/>
  <circle cx="126" cy="94" r="7" fill="url(#cb1)"/>
</svg>
