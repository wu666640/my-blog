<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 小狗与骨头 -->
  <g fill="none" stroke="#8B7355" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体（趴着） -->
    <ellipse cx="90" cy="130" rx="32" ry="20"/>
    <!-- 前腿（抱着骨头） -->
    <path d="M68 125 Q60 110 65 100"/>
    <path d="M78 125 Q75 108 78 100"/>
    <!-- 后腿 -->
    <path d="M108 135 Q115 155 118 160"/>
    <path d="M118 132 Q128 150 130 158"/>
    <ellipse cx="119" cy="162" rx="7" ry="3.5"/>
    <ellipse cx="131" cy="160" rx="7" ry="3.5"/>
    <!-- 尾巴 -->
    <path d="M118 120 Q140 118 142 110"/>
    <!-- 骨头 -->
    <g stroke="#C4A97D" stroke-width="2.5" fill="#F5EDE0">
      <path d="M62 104 Q55 95 58 90 Q62 86 66 88 L78 95"/>
      <path d="M78 95 L90 88 Q94 86 98 90 Q101 95 94 104 L82 111"/>
      <path d="M82 111 L70 118 Q66 120 62 118 Q58 114 62 104"/>
    </g>
    <!-- 头部 -->
    <circle cx="88" cy="95" r="26"/>
    <!-- 耳朵 -->
    <ellipse cx="66" cy="76" rx="8" ry="14" transform="rotate(-18 66 76)"/>
    <ellipse cx="110" cy="76" rx="8" ry="14" transform="rotate(18 110 76)"/>
    <!-- 眼睛（开心眯眼） -->
    <path d="M78 91 Q82 87 86 91" stroke-width="2.5"/>
    <path d="M92 91 Q96 87 100 91" stroke-width="2.5"/>
    <!-- 鼻子 -->
    <ellipse cx="89" cy="100" rx="4" ry="3.2" fill="#5C4033" stroke="none"/>
    <!-- 嘴 -->
    <path d="M83 105 Q89 110 95 105"/>
  </g>
</svg>
