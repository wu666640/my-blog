<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 坐着的线条小狗 -->
  <g fill="none" stroke="#8B7355" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体 -->
    <ellipse cx="100" cy="130" rx="30" ry="25"/>
    <!-- 前腿 -->
    <line x1="78" y1="140" x2="73" y2="170"/>
    <line x1="122" y1="140" x2="127" y2="170"/>
    <!-- 后脚 -->
    <ellipse cx="72" cy="172" rx="8" ry="4"/>
    <ellipse cx="128" cy="172" rx="8" ry="4"/>
    <!-- 尾巴（翘起） -->
    <path d="M125 115 Q145 95 140 75 Q138 68 135 70"/>
    <!-- 头部 -->
    <circle cx="100" cy="85" r="32"/>
    <!-- 耳朵（垂耳） -->
    <ellipse cx="72" cy="65" rx="10" ry="18" transform="rotate(-15 72 65)"/>
    <ellipse cx="128" cy="65" rx="10" ry="18" transform="rotate(15 128 65)"/>
    <!-- 眼睛 -->
    <circle cx="88" cy="80" r="4" fill="#8B7355"/>
    <circle cx="112" cy="80" r="4" fill="#8B7355"/>
    <!-- 眼睛高光 -->
    <circle cx="89" cy="78.5" r="1.2" fill="white" stroke="none"/>
    <circle cx="113" cy="78.5" r="1.2" fill="white" stroke="none"/>
    <!-- 鼻子 -->
    <ellipse cx="100" cy="92" rx="5" ry="4" fill="#5C4033" stroke="none"/>
    <!-- 嘴巴 -->
    <path d="M94 97 Q100 104 106 97"/>
    <!-- 脸颊红晕 -->
    <circle cx="78" cy="90" r="5" fill="#F0C8C0" stroke="none" opacity="0.6"/>
    <circle cx="122" cy="90" r="5" fill="#F0C8C0" stroke="none" opacity="0.6"/>
  </g>
</svg>
