  <line x1="155" y1="106" x2="149" y2="100" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="157" y1="93" x2="150" y2="88" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round"/>
