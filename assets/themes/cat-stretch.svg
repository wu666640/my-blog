<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 伸懒腰的八条猫 -->
  <g fill="none" stroke="#6B5B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体（弓起） -->
    <path d="M65 130 Q80 105 100 108 Q120 105 135 130"/>
    <!-- 身体条纹 -->
    <path d="M82 108 Q86 105 90 108" stroke-width="2"/>
    <path d="M100 107 Q104 104 108 107" stroke-width="2"/>
    <path d="M110 111 Q114 109 118 112" stroke-width="2"/>
    <!-- 前腿（前伸） -->
    <line x1="70" y1="128" x2="55" y2="150"/>
    <line x1="78" y1="125" x2="68" y2="150"/>
    <!-- 后腿（后蹬） -->
    <line x1="122" y1="128" x2="135" y2="155"/>
    <line x1="130" y1="125" x2="145" y2="148"/>
    <!-- 脚掌 -->
    <ellipse cx="54" cy="152" rx="6" ry="3.5"/>
    <ellipse cx="67" cy="152" rx="6" ry="3.5"/>
    <ellipse cx="136" cy="157" rx="6" ry="3.5"/>
    <ellipse cx="146" cy="150" rx="6" ry="3.5"/>
    <!-- 尾巴（高高翘起） -->
    <path d="M135 125 Q155 118 158 95 Q159 80 152 78"/>
    <line x1="154" y1="105" x2="148" y2="100" stroke-width="1.8"/>
    <line x1="156" y1="93" x2="150" y2="88" stroke-width="1.8"/>
    <line x1="154" y1="83" x2="149" y2="80" stroke-width="1.8"/>
    <!-- 头部 -->
    <circle cx="68" cy="90" r="26"/>
    <!-- 耳朵 -->
    <polygon points="46,72 40,48 62,66" fill="#E8DDD5"/>
    <polygon points="90,66 96,42 80,62" fill="#E8DDD5"/>
    <!-- 内耳 -->
    <polygon points="48,68 44,52 60,65" fill="#F0C8C0" stroke="none" opacity="0.6"/>
    <polygon points="88,64 92,48 80,62" fill="#F0C8C0" stroke="none" opacity="0.6"/>
    <!-- 眼睛（大圆眼） -->
    <circle cx="60" cy="86" r="5" fill="#6B5B4F"/>
    <circle cx="80" cy="84" r="5" fill="#6B5B4F"/>
    <circle cx="61.5" cy="84" r="1.8" fill="white" stroke="none"/>
    <circle cx="81.5" cy="82" r="1.8" fill="white" stroke="none"/>
    <!-- 鼻子 -->
    <polygon points="67,96 70,93 73,96" fill="#E08070" stroke="none"/>
    <!-- 嘴（打哈欠状） -->
    <ellipse cx="70" cy="100" rx="5" ry="3" fill="#F0C8C0" stroke="none" opacity="0.5"/>
    <!-- 胡须 -->
    <line x1="38" y1="90" x2="56" y2="93" stroke-width="1.5"/>
    <line x1="36" y1="96" x2="55" y2="96" stroke-width="1.5"/>
    <line x1="88" y1="86" x2="78" y2="90" stroke-width="1.5"/>
    <line x1="92" y1="92" x2="80" y2="93" stroke-width="1.5"/>
  </g>
</svg>
