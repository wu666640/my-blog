<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 舔爪子的猫 -->
  <g fill="none" stroke="#6B5B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体（侧卧） -->
    <ellipse cx="100" cy="130" rx="32" ry="22"/>
    <!-- 身体条纹 -->
    <path d="M78 120 Q82 118 86 120" stroke-width="2"/>
    <path d="M114 120 Q118 118 122 120" stroke-width="2"/>
    <!-- 后腿 -->
    <path d="M120 135 Q130 155 125 165"/>
    <ellipse cx="125" cy="167" rx="8" ry="4"/>
    <!-- 前腿（举起舔） -->
    <path d="M78 125 Q65 105 72 85"/>
    <ellipse cx="72" cy="84" rx="6" ry="4"/>
    <!-- 尾巴 -->
    <path d="M128 118 Q150 105 152 90 Q153 82 148 85"/>
    <line x1="147" y1="100" x2="143" y2="94" stroke-width="1.8"/>
    <line x1="150" y1="92" x2="145" y2="87" stroke-width="1.8"/>
    <!-- 头部（低着舔爪） -->
    <circle cx="82" cy="82" r="28"/>
    <!-- 耳朵 -->
    <polygon points="58,63 52,38 72,58" fill="#E8DDD5" stroke="#6B5B4F"/>
    <polygon points="106,58 112,35 96,55" fill="#E8DDD5" stroke="#6B5B4F"/>
    <!-- 内耳 -->
    <polygon points="60,58 56,43 70,56" fill="#F0C8C0" stroke="none" opacity="0.6"/>
    <polygon points="104,56 108,41 96,54" fill="#F0C8C0" stroke="none" opacity="0.6"/>
    <!-- 眼睛（眯着享受） -->
    <path d="M73 78 Q77 75 81 78" stroke-width="2.5"/>
    <path d="M86 76 Q90 73 94 76" stroke-width="2.5"/>
    <!-- 鼻子 -->
    <polygon points="81,87 83,85 85,87" fill="#E08070" stroke="none"/>
    <!-- 嘴巴 -->
    <path d="M79 90 Q83 93 87 90"/>
    <!-- 胡须 -->
    <line x1="52" y1="82" x2="66" y2="85" stroke-width="1.5"/>
    <line x1="50" y1="88" x2="65" y2="88" stroke-width="1.5"/>
    <line x1="100" y1="78" x2="88" y2="83" stroke-width="1.5"/>
    <line x1="102" y1="84" x2="89" y2="86" stroke-width="1.5"/>
    <!-- 小舌头 -->
    <ellipse cx="74" cy="86" rx="2.5" ry="3.5" fill="#F08080" stroke="none" opacity="0.6" transform="rotate(20 74 86)"/>
  </g>
</svg>
