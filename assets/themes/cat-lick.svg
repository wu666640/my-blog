  <path d="M76 91 Q80 94 84 91" fill="none" stroke="#A09080" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="71" cy="87" rx="2.5" ry="4" fill="#F0A0A0" opacity="0.6" transform="rotate(15 71 87)"/>
  <!-- 胡须 -->
  <g stroke="#B0A090" stroke-width="1.2" stroke-linecap="round">
    <line x1="48" y1="82" x2="64" y2="85"/>
    <line x1="46" y1="88" x2="63" y2="88"/>
    <line x1="98" y1="78" x2="86" y2="83"/>
    <line x1="100" y1="84" x2="87" y2="86"/>
