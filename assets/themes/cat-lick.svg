<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 八条 — 舔爪子 -->
  <defs>
    <radialGradient id="cb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3B3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB3B3" stop-opacity="0"/>
