name: 构建并部署

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      - name: 运行构建
        run: npm run build

      - name: 部署到 GitHub Pages
        run: |
          mkdir /tmp/publish
          cp -r . /tmp/publish/
          cd /tmp/publish
          rm -rf .git .github node_modules package.json package-lock.json build.js netlify.toml
          touch .nojekyll

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy $(date +%Y-%m-%d-%H%M%S)" || exit 0
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
          echo "✅ 已部署到 gh-pages"

      - name: 部署到 CloudBase（国内镜像）
        run: |
          npm install -g @cloudbase/cli
          tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}
          tcb hosting deploy index.html -e blog-d4g0rvrjaa17c65a9
          for d in css js admin images posts data assets; do
            tcb hosting deploy "$d" "$d" -e blog-d4g0rvrjaa17c65a9
          done
          echo "✅ 已部署到 CloudBase"
