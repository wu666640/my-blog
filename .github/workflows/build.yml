name: 构建生成文件

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 运行构建
        run: npm run build

      - name: 提交生成文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/posts.js js/about.js js/gallery.js js/music.js
          if git diff --staged --quiet; then
            echo "生成文件无变化，跳过提交"
          else
            git commit -m "🤖 自动构建：更新生成文件 [skip ci]"
            git push
            echo "已提交更新，将触发 Netlify 部署"
          fi
