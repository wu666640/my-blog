name: 构建并部署

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 运行构建
        run: npm run build

      - name: 提交生成文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/posts.js js/about.js js/gallery.js js/music.js
          if git diff --staged --quiet; then
            echo "生成文件无变化，跳过提交"
          else
            git commit -m "🤖 自动构建：更新生成文件 [skip ci]"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          enable_jekyll: false
          exclude_assets: '.github/**,node_modules/**,.git/**,package.json,package-lock.json,build.js,netlify.toml'
