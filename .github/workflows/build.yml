name: 构建并部署

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 运行构建
        run: npm run build

      - name: 提交生成文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/posts.js js/about.js js/gallery.js js/music.js
          if git diff --staged --quiet; then
            echo "生成文件无变化"
          else
            git commit -m "🤖 自动构建：更新生成文件 [skip ci]"
            git push
          fi

      - name: 部署到 gh-pages
        run: |
          # 创建临时发布目录
          mkdir /tmp/publish
          cp -r . /tmp/publish/
          cd /tmp/publish
          rm -rf .git .github node_modules package.json build.js netlify.toml
          touch .nojekyll

          # 推送到 gh-pages 分支
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy $(date +%Y-%m-%d-%H%M%S)"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
          echo "✅ 已部署到 gh-pages 分支"
