title: 心安之地
artist: 许嵩
cover: images/4005687313.jpg
description: >-
  
  此心安处是吾乡”出自宋代苏轼《定风波·南海归赠王定国侍人寓娘》，原句为“试问岭南应不好，却道：此心安处是吾乡”，表达随遇而安的豁达心境。该词创作背景与苏轼好友王巩相关，王巩因“乌台诗案”被贬岭南，其歌妓柔奴（寓娘）随行，北归后苏轼询问岭南境况，柔奴以“此心安处，便是吾乡”作答
category: 华语流行
tags_override: 许嵩，安泊猜想
