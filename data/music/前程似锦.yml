title: 前程似锦
artist: 许嵩
cover: images/4005687313.jpg
description: 许嵩总擅长写体面克制的离别。从前他被说埋头做音乐没有出路，却凭坚持站上万人满座的舞台；如今在《前程似锦》里写一段温柔散场：天亮清冷广场，彻夜互诉衷肠，最后平静就此别过。他一生坚守热爱，却也坦然接受人与人走散，既有十年伏案终得满堂喝彩的执着，也有天亮挥手祝对方前程似锦的温柔。
category: 华语流行
tags_override: 安泊猜想，许嵩
