# Decap CMS 配置文件
# 访问 https://你的域名.netlify.app/admin 进入管理后台

backend:
  name: git-gateway
  branch: main

# 媒体文件存储位置
media_folder: "images"
public_folder: "/images"

# 网站设置
locale: "zh_Hans"

# 内容集合
collections:
  # ----- 文章 -----
  - name: "posts"
    label: "📝 文章"
    label_singular: "文章"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    editor:
      preview: false
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        hint: "文章的标题"
        pattern: [".+", "标题不能为空"]
      - label: "封面图"
        name: "cover"
        widget: "image"
        required: false
        hint: "可选，文章列表展示的封面图"
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "摘要"
        name: "excerpt"
        widget: "text"
        hint: "显示在文章列表中的简短描述"
        pattern: [".+", "摘要不能为空"]
      - label: "标签"
        name: "tags"
        widget: "list"
        hint: "每篇文章可以有多个标签"
        default: ["生活"]
      - label: "正文"
        name: "body"
        widget: "markdown"
        hint: "支持 Markdown 语法，可拖入图片"

  # ----- 个人资料（单页）-----
  - name: "about"
    label: "👤 个人资料"
    files:
      - name: "about"
        label: "关于我页面"
        file: "data/about.json"
        fields:
          - label: "昵称"
            name: "name"
            widget: "string"
          - label: "头像"
            name: "avatar"
            widget: "image"
            required: false
            hint: "建议正方形图片，比如 200x200"
          - label: "一句话介绍"
            name: "tagline"
            widget: "string"
          - label: "个人简介"
            name: "bio"
            widget: "markdown"
            hint: "支持 Markdown"
          - label: "技能"
            name: "skills"
            widget: "list"
            fields:
              - { label: "技能名", name: "name", widget: "string" }
              - { label: "熟练度 (0-100)", name: "level", widget: "number", value_type: "int", min: 0, max: 100 }
          - label: "社交链接"
            name: "social"
            widget: "list"
            fields:
              - { label: "名称", name: "label", widget: "string" }
              - { label: "链接", name: "url", widget: "string" }
              - { label: "图标 Emoji", name: "icon", widget: "string", hint: "如 🐙 📧 🐦" }
